{% load static imgopt %}
<a class="service-card tilt reveal" href="{{ service.get_absolute_url }}" aria-label="{{ service.name }}">
  {% if service.image %}
    <div class="service-card-media">
      <img src="{{ service.image.url|imgopt:'f_auto,q_auto:good,w_500,c_limit' }}" alt="{{ service.name }}" loading="lazy">
    </div>
  {% else %}
    <div class="service-card-media service-card-media--fallback">
      <span class="service-card-monogram">{{ service.icon_key|default:service.name|slice:":1"|upper }}</span>
    </div>
  {% endif %}
  <div class="service-card-body">
    <p class="eyebrow">{{ service.tagline|default:"Signature service" }}</p>
    <h3 class="service-card-title">{{ service.name }}</h3>
    <p class="service-card-desc">{{ service.short_description }}</p>
    <span class="service-card-link">Explore <span aria-hidden="true">→</span></span>
  </div>
</a>
