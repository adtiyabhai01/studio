<figure class="t-card reveal">
  <div class="t-card-stars" aria-label="{{ testimonial.rating }} star rating">
    {% for _ in "12345" %}
      {% if forloop.counter0 < testimonial.rating %}
        <span class="star">★</span>
      {% else %}
        <span class="star star--off">☆</span>
      {% endif %}
    {% endfor %}
  </div>
  <blockquote class="t-card-quote">“{{ testimonial.review }}”</blockquote>
  <figcaption class="t-card-meta">
    {% if testimonial.client_photo %}
      <img class="t-card-avatar" src="{{ testimonial.client_photo.url }}" alt="{{ testimonial.client_name }}" loading="lazy">
    {% else %}
      <span class="t-card-avatar t-card-avatar--mono">{{ testimonial.client_name|slice:":1" }}</span>
    {% endif %}
    <span class="t-card-who">
      <strong>{{ testimonial.client_name }}</strong>
      <span>{{ testimonial.event_type }}{% if testimonial.city %} · {{ testimonial.city }}{% endif %}</span>
    </span>
  </figcaption>
</figure>
